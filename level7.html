        });
        if (pos.length >= 2) {
          const a = X(b * sub + pos[0]) + (up ? 6 : -6), z = X(b * sub + pos[pos.length - 1]) + (up ? 6 : -6);
          const beams = (up && sub === 4 && pos.length === 4) ? 2 : 1;
          for (let k = 0; k < beams; k++) rect(a - 0.8, up ? 4 + k * 7 : 119.5 - k * 7, z - a + 1.6, 4.5);
        } else if (pos[0] !== 0) {
          const i = b * sub + pos[0], sx = X(i) + (up ? 6 : -6);
          erest(x0 + 2, up ? 44 : 92);
          out['thick' + G(i)] += up ? ('M' + sx + ' 4q10 8 8 22') : ('M' + sx + ' 124q10 -8 8 -22');
        }
      }
    };
    voice(hands, true);
    voice(feet, false);
    out.aria = L.title + ', variation ' + V.name + ': ' + V.desc;
    return out;
  }
  stop() {
    this.playing = false;
    clearTimeout(this.loop);
  }
  setLesson(k) {
    this.stop();
    this.setState({ lesson: k, v: 0, playing: false, step: -1 });
  }
  toggle() {
    if (this.state.playing) {
      this.stop();
      this.setState({ playing: false, step: -1 });
      return;
    }
    this.audio();
    this.step = 0;
    this.playing = true;
    this.setState({ playing: true });
    this.tick();
  }
  setBpm(delta) {
    this.setState((s) => ({ bpm: Math.max(40, Math.min(180, s.bpm + delta)) }));
  }
  renderVals() {
    const lit = this.state.lit || {};
    const piece = (id, cym) => ({
      hit: () => this.hit(id),
      head: lit[id] ? (cym ? '#ffe28a' : '#ffd35c') : (cym ? 'url(#bronze)' : (id === 'kick' ? '#f1efe8' : '#ece8df')),
      ink: '#141414',
      filter: lit[id] ? 'url(#glow)' : 'none'
    });
    const L = this.lessons[this.state.lesson];
    const V = L.vars[this.state.v] || L.vars[0];
    const labels = L.labels;
    const on = (k) => this.state.lesson === k;
    return {
      crashL: piece('crashL', true),
      crashR: piece('crashR', true),
      hihat: piece('hihat', true),
      ride: piece('ride', true),
      kick: piece('kick', false),
      snare: piece('snare', false),
      tom: piece('tom', false),
      floor: piece('floor', false),
      last: this.state.last,
      tabs: ['rock', 'waltz', 'swing', 'rock16', 'sync', 'indep', 'openhh', 'fills'].reduce((o, k) => { o[k] = { pick: () => this.setLesson(k), bg: on(k) ? '#ffffff' : 'transparent', ink: on(k) ? '#0a0a0a' : '#ffffff' }; return o; }, {}),
      vars: L.vars.map((x, n) => ({
        label: String(n + 1),
        aria: 'Variation ' + (n + 1) + ': ' + x.desc,
        pick: () => this.setVar(n),
        bg: n === this.state.v ? '#ffd35c' : 'transparent',
        ink: n === this.state.v ? '#0a0a0a' : '#ffffff',
        border: n === this.state.v ? '#ffd35c' : '#ffffff'
      })),
      ts: String(L.beats),
      nt: this.notation(L, V, this.state.step),
      legend: L.legend,
      lessonTitle: L.title + ' · Variation ' + (this.state.v + 1),
      varDesc: V.desc,
      lessonDesc: L.legend,
      bpm: this.state.bpm,
      slower: () => this.setBpm(-5),
      faster: () => this.setBpm(5),
      toggleSound: () => this.setState((s) => ({ soundOn: !s.soundOn })),
      soundLabel: this.state.soundOn ? 'SOUND: ON' : 'SOUND: OFF',
      toggle: () => this.toggle(),
      playLabel: this.state.playing ? 'STOP' : 'PLAY GROOVE',
      btnBg: this.state.playing ? '#ffffff' : 'transparent',
      btnInk: this.state.playing ? '#0a0a0a' : '#ffffff',
      nc: labels.reduce((o, l, n) => { o['s' + n] = n === this.state.step ? '#ffd35c' : '#ffffff'; return o; }, {}),
      counts: labels.map((l, n) => ({
        label: l,
        w: labels.length > 8 ? 22 : 34,
        fs: labels.length > 8 ? 13 : 16,
        bg: n === this.state.step ? '#ffd35c' : 'transparent',
        ink: n === this.state.step ? '#0a0a0a' : '#ffffff'
      }))
    };
  }
}

window.__mount(Component);
</script>
