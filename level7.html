<meta charset="utf-8">

<title>Level 7 — The Kit · Amadeus School of Drums</title>
<meta name="description" content="Level 7 drum kit lessons: play along with rock, swing, bebop and 16th-note grooves on an interactive drum set with an adjustable metronome.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&amp;family=IBM+Plex+Mono:wght@400;600&amp;display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0a0a;--ink:#fff;--muted:#bdbdbd;--line:#2a2a2a;--gold:#ffd35c;--gold2:#ffe9a8}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'IBM Plex Mono',ui-monospace,monospace;-webkit-text-size-adjust:100%}
a{color:var(--gold)}a:hover{color:var(--gold2)}
button{font-family:inherit;cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
@keyframes pend{from{transform:rotate(-24deg)}to{transform:rotate(24deg)}}
@keyframes talk{from{transform:scaleY(.3)}to{transform:scaleY(1.9)}}
.shell{max-width:1280px;margin:0 auto;padding:10px 0 32px}
.nav{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:0 40px;font-size:14px}
.nav a{text-decoration:none;padding:10px 0}
.pad-x{padding-left:40px;padding-right:40px}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;padding-top:18px}
.kicker{font-size:13px;letter-spacing:4px;color:var(--muted)}
h1{margin:4px 0;font-family:'Bebas Neue',Impact,sans-serif;font-weight:400;font-size:clamp(46px,7vw,88px);line-height:.9;letter-spacing:2px}
.sub{font-size:16px;color:#d9d9d9;margin:0}
.last{text-align:right;min-width:180px}
.last .l{font-size:12px;letter-spacing:3px;color:var(--muted)}
.last .v{font-family:'Bebas Neue',Impact,sans-serif;font-size:44px;line-height:1;color:var(--gold)}
.guide{display:flex;align-items:center;gap:20px;padding-top:12px}
.guide svg{width:110px;height:auto;flex-shrink:0}
.bubble{flex:1;border:2px solid var(--ink);border-radius:16px;padding:12px 18px;display:flex;flex-direction:column;gap:6px}
.bubble .hd{display:flex;justify-content:space-between;align-items:center;gap:10px}
.bubble .who{font-size:12px;letter-spacing:3px;color:var(--gold)}
.bubble .say{font-size:15px;line-height:1.5}
.talk{min-height:36px;padding:0 14px;border:1px solid var(--gold);background:transparent;color:var(--gold);font-size:13px;border-radius:4px}
.talk.on{background:var(--gold);color:#0a0a0a}
.kitbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding-top:18px}
.lbl{font-size:12px;letter-spacing:3px;color:var(--muted);margin-right:4px}
.chip{min-height:40px;padding:0 12px;border:1px solid var(--ink);background:transparent;color:var(--ink);font-size:13px;border-radius:4px}
.chip.on{background:var(--ink);color:#0a0a0a}
.kitnote{font-size:13px;color:var(--muted);flex-basis:100%;margin:2px 0 0}
.kitbox{position:relative;width:100%}
.kitstage{position:relative;width:100%;aspect-ratio:1280/560}
.kitstage svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.pad{position:absolute;padding:0;border:0;background:transparent;border-radius:12px;-webkit-tap-highlight-color:transparent}
.pad.round{border-radius:50%}
.feels{border-top:1px solid var(--line);padding-top:16px;display:flex;flex-direction:column;gap:12px}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.h2{font-family:'Bebas Neue',Impact,sans-serif;font-size:30px;letter-spacing:2px;margin-right:8px;line-height:1}
.feel{min-height:40px;padding:0 10px;border:1px solid var(--ink);background:transparent;color:var(--ink);font-size:12px;border-radius:4px;letter-spacing:.5px}
.feel.on{background:var(--ink);color:#0a0a0a}
.var{min-height:40px;min-width:44px;padding:0 12px;border:1px solid var(--ink);background:transparent;color:var(--ink);font-size:16px;font-weight:600;border-radius:4px}
.var.on{background:var(--gold);border-color:var(--gold);color:#0a0a0a}
.vdesc{font-size:15px;flex:1 1 280px;margin-left:8px}
.lesson{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.lesson .t{font-size:14px}.lesson .d{font-size:13px;color:var(--muted)}
.counts{display:flex;gap:4px;flex-wrap:wrap}
.cnt{height:40px;min-width:30px;padding:0 4px;display:flex;align-items:center;justify-content:center;border:1px solid #3a3a3a;border-radius:4px;font-size:15px;font-weight:600}
.cnt.sm{min-width:22px;font-size:13px}
.cnt.on{background:var(--gold);color:#0a0a0a;border-color:var(--gold)}
.swipe{display:none;margin:0;font-size:12px;color:var(--muted)}
.staff{overflow-x:auto;-webkit-overflow-scrolling:touch}
.staff svg{display:block;width:100%;min-width:700px;height:auto}
.transport{display:flex;align-items:center;gap:16px;flex-wrap:wrap;border-top:1px solid var(--line);margin-top:16px;padding-top:16px;padding-bottom:16px;background:var(--bg)}
.play{min-width:150px;min-height:56px;padding:0 16px;border:2px solid var(--ink);background:transparent;color:var(--ink);font-family:'Bebas Neue',Impact,sans-serif;font-size:28px;letter-spacing:2px;border-radius:4px}
.play.on{background:var(--ink);color:#0a0a0a}
.tempo{display:flex;align-items:center;gap:8px}
.step{width:44px;height:44px;border:1px solid var(--ink);background:transparent;color:var(--ink);font-size:22px;border-radius:4px}
.bpm{width:72px;text-align:center;display:flex;flex-direction:column}
.bpm b{font-family:'Bebas Neue',Impact,sans-serif;font-size:34px;line-height:1;font-weight:400}
.bpm span{font-size:11px;letter-spacing:2px;color:var(--muted)}
.slider{flex:1 1 220px;display:flex;align-items:center;gap:10px;font-size:12px;color:var(--muted)}
.slider input{flex:1;accent-color:var(--gold);height:32px}
.snd{min-height:44px;padding:0 16px;border:1px solid var(--ink);background:transparent;color:var(--ink);font-size:14px;border-radius:4px}
.bookhead{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:16px}
.bookhead .h2{font-size:26px}
.full{display:inline-flex;align-items:center;min-height:44px;padding:0 16px;border:2px solid var(--gold);border-radius:4px;color:#0a0a0a;background:var(--gold);font-size:14px;font-weight:600;text-decoration:none}
.full:hover{color:#0a0a0a;background:var(--gold2)}
.boxes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px;padding-top:14px}
.box{border:2px solid var(--ink);border-radius:10px;overflow:hidden}
.box .bh{background:var(--ink);color:#0a0a0a;padding:6px 14px;display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13px;font-weight:600;letter-spacing:1px}
.box .bh small{font-size:11px;letter-spacing:3px;color:#5a5a5a}
.box .bt{padding:12px 14px;font-size:14px;line-height:1.55;color:#f2f2f2}
@media (max-width:820px){
  .nav,.pad-x{padding-left:16px;padding-right:16px}
  .top{flex-direction:column;align-items:flex-start}
  .last{text-align:left;display:flex;align-items:baseline;gap:10px;min-width:0}
  .last .v{font-size:32px}
  .guide{align-items:flex-start;gap:12px}
  .guide svg{width:64px}
  .bubble{padding:10px 12px}
  .bubble .say{font-size:15px}
  .boxes{grid-template-columns:1fr;gap:14px}
  .vdesc{margin-left:0;flex-basis:100%}
  .swipe{display:block}
  .transport{position:sticky;bottom:0;z-index:5;gap:8px 10px;margin-top:12px;padding-top:10px;padding-bottom:calc(8px + env(safe-area-inset-bottom));box-shadow:0 -10px 20px rgba(0,0,0,.6)}
  .play{min-width:0;flex:1 1 110px;font-size:22px;min-height:46px}
  .step{width:40px;height:40px}
  .bpm{width:58px}.bpm b{font-size:28px}
  .slider{order:5;flex:1 1 150px}
  .slider span{display:none}
  .snd{order:6;min-height:34px;padding:0 10px;font-size:12px}
}
@media (prefers-reduced-motion:reduce){.guide svg *{animation:none!important}}
</style>

<script>
(function(){
  var comp=null, pending=false, root=document.getElementById('app'), tpl=document.getElementById('tpl');
  window.DCLogic=function(props){ this.props=props||{}; this.state={}; };
  DCLogic.prototype.setState=function(u){ var n=typeof u==='function'?u(this.state,this.props):u; this.state=Object.assign({},this.state,n); schedule(); };
  DCLogic.prototype.forceUpdate=function(){ schedule(); };
  function schedule(){ if(pending) return; pending=true; requestAnimationFrame(function(){ pending=false; paint(); }); }
  function look(path, scope){
    path=path.trim();
    if(path==='true') return true; if(path==='false') return false;
    if(/^-?\d+(\.\d+)?$/.test(path)) return +path;
    var parts=path.split('.'), v=scope;
    for(var i=0;i<parts.length;i++){ if(v==null) return undefined; v=v[parts[i]]; }
    return v;
  }
  var WHOLE=/^\{\{\s*([^}]+?)\s*\}\}$/;
  function interp(str, scope){ return str.replace(/\{\{\s*([^}]+?)\s*\}\}/g,function(_,p){ var v=look(p,scope); return v==null?'':String(v); }); }
  function build(node, scope, parent){
    if(node.nodeType===3){ parent.appendChild(document.createTextNode(interp(node.nodeValue,scope))); return; }
    if(node.nodeType!==1) return;
    var tag=node.localName;
    if(tag==='sc-for'){
      var list=look(WHOLE.exec(node.getAttribute('list'))[1],scope)||[], as=node.getAttribute('as')||'item';
      list.forEach(function(item,idx){ var s=Object.create(scope); s[as]=item; s.$index=idx; kids(node,s,parent); });
      return;
    }
    if(tag==='sc-if'){ if(look(WHOLE.exec(node.getAttribute('value'))[1],scope)) kids(node,scope,parent); return; }
    var el=document.createElementNS(node.namespaceURI,node.localName);
    el.__on={};
    for(var i=0;i<node.attributes.length;i++){
      var a=node.attributes[i], name=a.name, val=a.value;
      if(/^on[a-z]+$/.test(name)){ var m=WHOLE.exec(val); if(m){ var fn=look(m[1],scope); if(typeof fn==='function'){ el.__on[name.slice(2)]=fn; listen(name.slice(2)); } } continue; }
      el.setAttribute(name, interp(val,scope));
    }
    kids(node,scope,el);
    parent.appendChild(el);
  }
  function kids(node,scope,parent){ var c=(node.content||node).childNodes; for(var i=0;i<c.length;i++) build(c[i],scope,parent); }
  var listening={};
  function listen(type){
    if(listening[type]) return; listening[type]=true;
    root.addEventListener(type,function(e){
      var n=e.target;
      while(n&&n!==root){ if(n.__on&&n.__on[type]){ n.__on[type](e); return; } n=n.parentNode; }
    });
  }
  function patch(parent,news){
    var olds=parent.childNodes, i;
    for(i=0;i<news.length;i++){
      var o=olds[i], n=news[i];
      if(!o){ parent.appendChild(n); news=[].slice.call(news); continue; }
      if(o.nodeType===3&&n.nodeType===3){ if(o.nodeValue!==n.nodeValue) o.nodeValue=n.nodeValue; continue; }
      if(o.nodeType===1&&n.nodeType===1&&o.namespaceURI===n.namespaceURI&&o.localName===n.localName){
        var k, oa=o.attributes, na=n.attributes;
        for(k=oa.length-1;k>=0;k--){ if(!n.hasAttribute(oa[k].name)) o.removeAttribute(oa[k].name); }
        for(k=0;k<na.length;k++){ if(o.getAttribute(na[k].name)!==na[k].value) o.setAttribute(na[k].name,na[k].value); }
        o.__on=n.__on;
        patch(o,[].slice.call(n.childNodes));
        continue;
      }
      parent.replaceChild(n,o);
    }
    while(parent.childNodes.length>news.length) parent.removeChild(parent.lastChild);
  }
  function paint(){
    var vals=comp.renderVals(), frag=document.createDocumentFragment();
    kids(tpl.content,vals,frag);
    patch(root,[].slice.call(frag.childNodes));
    if(comp.afterPaint) comp.afterPaint();
  }
  window.__mount=function(C){ comp=new C({bpm:80}); paint(); if(comp.componentDidMount) comp.componentDidMount(); };
  window.addEventListener('hashchange',function(){ if(comp&&comp.componentDidMount) comp.componentDidMount(); });
})();

  tickNoAudio() {

  setVar(n) {

  }
  setKit(k) {
    try { localStorage.setItem('l7kit', k); } catch (e) {}

  }
  notation(L, V, cur) {
    const n = L.steps, sub = L.sub, dx = Math.round(900 / n);
    const X = (i) => 190 + i * dx;
    const Y = { hihat: 34, ride: 40, tom: 46, snare: 58, floor: 70, kick: 82, hhfoot: 94 };
    const out = { fillW: '', fillG: '', thinW: '', thinG: '', thickW: '', thickG: '' };

  }
  stop() {

  }
  setLesson(k) {

  }
  toggle() {

  setBpm(val) {

  }

      soundLabel: this.state.soundOn ? 'SOUND: ON' : 'SOUND: OFF',
      toggle: () => this.toggle(),
      playLabel: this.state.playing ? 'STOP' : 'PLAY GROOVE',
      playCls: this.state.playing ? 'on' : '',

  }
