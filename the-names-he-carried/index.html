<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>The Names He Carried</title>
<meta name="description" content="The Names He Carried: The Laurence Brown Douglas Story, by Doug Garceau.">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Courier+Prime:wght@400;700&display=swap">
<style>
/* VOICE: a night-edition keepsake, quiet, grave, exact
   IDEA: the book's own etched cover, opened up into a page
   PICTURE: the ink zeppelin over Leith, full width, under the title
   COLOUR and TYPE: ink black, cover cream, one ember accent; EB Garamond with Courier Prime labels
   LAYOUT: one centred column for reading; plain list rows for the archive */
:root{--bg:#0b0a09;--sheet:#15130f;--ink:#efe6d2;--soft:#b9ae97;--rule:#3a342a;--ember:#d9a35b}
*{box-sizing:border-box;min-width:0}html{scroll-padding-top:90px}
body{margin:0;background:var(--bg);color:var(--ink);font:19px/1.7 "EB Garamond",Georgia,serif;overflow-x:clip;-webkit-font-smoothing:antialiased}
a{color:var(--ember)}
.wrap{max-width:1040px;margin:0 auto;padding:28px max(4vw,16px) 80px}
.top{position:sticky;top:0;z-index:5;background:#0b0a09ee;backdrop-filter:blur(6px);border-bottom:1px solid var(--rule)}
.top .wrap{padding:10px max(4vw,16px);display:flex;gap:10px 16px;align-items:center;flex-wrap:wrap}
.top b{font:600 20px/1.2 "EB Garamond",serif;flex:1;min-width:200px}.top b a{color:var(--ink)!important}
.tabs{display:flex;gap:4px;flex-wrap:wrap;width:100%}
.btn{all:unset;cursor:pointer;font:400 15px/1 "Courier Prime",monospace;padding:12px 12px;border-radius:3px;color:var(--soft);text-align:center;border:1px solid transparent}
.btn:hover{color:var(--ink)}.btn:focus-visible{outline:2px solid var(--ember)}
.tabs .btn[aria-current=true]{color:var(--ink);border-color:var(--rule);background:var(--sheet)}
.btn.main{color:#0b0a09;background:var(--ink);font:700 18px/1 "Courier Prime",monospace;padding:18px 28px;border-radius:2px}
.btn.main:hover{background:#fff}
select.jump{font:400 16px "Courier Prime",monospace;padding:10px;border-radius:3px;background:var(--sheet);color:var(--ink);border:1px solid var(--rule);max-width:100%;min-height:44px}
.hero{position:relative;margin:0 calc(50% - 50vw);text-align:center;padding:clamp(36px,6vw,70px) 16px 0;background:radial-gradient(ellipse at 50% 70%,#1b1812 0,#0b0a09 70%)}
.hero .k{font:400 15px "Courier Prime",monospace;color:var(--soft);margin:0}
.hero h1{font:500 clamp(44px,8vw,86px)/1.02 "EB Garamond",serif;margin:14px 0 6px;text-wrap:balance}
.hero .sub{font:italic 400 clamp(22px,3vw,30px)/1.3 "EB Garamond",serif;color:var(--soft);margin:0 0 28px}
.hero .art{display:block;width:min(760px,100%);margin:0 auto;aspect-ratio:745/1082;object-fit:cover;object-position:50% 30%;max-height:70vh;mask-image:linear-gradient(#000 70%,transparent);-webkit-mask-image:linear-gradient(#000 70%,transparent)}
.hero .cta{position:relative;margin-top:-90px;padding-bottom:20px;display:flex;flex-direction:column;align-items:center;gap:22px}
.ded{font:italic 400 22px/1.5 "EB Garamond",serif;color:var(--soft);margin:0}
@media(prefers-reduced-motion:no-preference){.hero .art{animation:rise 1.6s ease-out both}@keyframes rise{from{opacity:0;transform:translateY(14px)}}}
.route{margin:40px 0;border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);padding:22px 0}
.route h3,.sec .lede,.part,.pt,.no,.era{font-family:"Courier Prime",monospace}
.route h3{font-size:14px;font-weight:400;color:var(--soft);margin:0 0 14px;text-align:center}
.stops{display:grid;grid-template-columns:repeat(9,minmax(0,1fr));position:relative}
.stops:before{content:"";position:absolute;left:5%;right:5%;top:11px;border-top:1px dashed var(--ember)}
.stop{text-align:center;position:relative}.stop i{display:block;width:10px;height:10px;border-radius:50%;background:var(--ember);margin:6px auto 8px;box-shadow:0 0 0 4px var(--bg)}
.stop b{display:block;font:500 17px/1.2 "EB Garamond",serif}.stop span{font:400 13px/1.3 "Courier Prime",monospace;color:var(--soft)}
@media(max-width:700px){.stops{grid-template-columns:repeat(3,minmax(0,1fr));row-gap:18px}.stops:before{display:none}}
h2.toc,.sec h2,.chap h2{font:500 clamp(32px,5vw,48px)/1.08 "EB Garamond",serif;margin:30px 0 6px;text-wrap:balance}
.sec .lede{color:var(--soft);font-size:15px;margin:0 0 22px}
.part{font-size:14px;color:var(--ember);margin:30px 0 4px;padding-top:12px;border-top:1px solid var(--rule)}
.toc-row{all:unset;cursor:pointer;display:flex;gap:14px;align-items:baseline;width:100%;padding:11px 2px;border-bottom:1px solid #2a251e}
.toc-row:hover .t,.toc-row:focus-visible .t{color:var(--ember)}
.toc-row .n{font:400 15px "Courier Prime",monospace;color:var(--soft);min-width:2.2em}.toc-row .t{font-size:21px}
.toc-row .e{margin-left:auto;font:400 13px "Courier Prime",monospace;color:var(--soft);white-space:nowrap}
.chap{max-width:700px;margin:0 auto}
.chap .pt{font-size:14px;color:var(--soft);margin-top:24px}.chap .no{font-size:15px;color:var(--ember);margin-top:16px}
.chap .era{font-size:14px;color:var(--soft);border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);padding:8px 0;margin:14px 0 28px}
.chap p{margin:0 0 1.1em}.chap h3{font:500 24px "EB Garamond",serif;margin:28px 0 8px}
.pager{display:flex;justify-content:space-between;gap:12px;margin-top:40px;flex-wrap:wrap}.pager .btn{flex:1;min-width:140px;border-color:var(--rule);padding:14px}
figure{margin:28px 0}figure img{width:100%;height:auto;border-radius:2px}figcaption{font:400 14px/1.5 "Courier Prime",monospace;color:var(--soft);margin-top:8px}
.headline{border-top:3px double var(--ink);border-bottom:1px solid var(--ink);text-align:center;padding:14px 4px;margin:6px 0 26px}
.headline .mast{font:400 13px "Courier Prime",monospace;color:var(--soft)}.headline .hd{font:600 28px/1.1 "EB Garamond",serif;text-transform:uppercase;margin:8px 0 4px}.headline .dl{font:italic 15px "EB Garamond",serif;color:var(--soft)}
.stone{text-align:center;font:500 20px/1.6 "EB Garamond",serif;letter-spacing:.12em;margin:1.4em 0;padding:18px;border:1px solid var(--rule)}
table.ap{border-collapse:collapse;width:100%;font-size:17px}table.ap td{border-bottom:1px solid var(--rule);padding:9px 6px;vertical-align:top}table.ap td:first-child{width:32%;color:var(--soft);font-family:"Courier Prime",monospace;font-size:14px}
.notesall{font-size:16px;color:var(--soft)}.nch{font:500 19px "EB Garamond",serif;color:var(--ink);margin:24px 0 6px}.notes{padding-left:1.4em}.notes li{margin:.35em 0;overflow-wrap:anywhere}
.recrow{display:grid;grid-template-columns:5em minmax(0,1fr);gap:16px;border-top:1px solid var(--rule);padding:18px 0}
.recrow .y{font:400 22px "Courier Prime",monospace;color:var(--ember)}.recrow h3{font:500 23px/1.3 "EB Garamond",serif;margin:0 0 4px}.recrow p{margin:0 0 6px}
.recrow .ref{font:400 13px "Courier Prime",monospace;color:var(--soft)}
.recrow img{width:100%;max-width:900px;border-radius:2px;margin-top:10px;cursor:zoom-in;filter:sepia(.15)}.recrow img.big{max-width:none;cursor:zoom-out}
.lnk{all:unset;cursor:pointer;color:var(--ember);text-decoration:underline;text-underline-offset:3px}
.tl{list-style:none;margin:0;padding:0}.tl li{display:grid;grid-template-columns:12em minmax(0,1fr);gap:16px;border-top:1px solid var(--rule);padding:11px 0}
.tl b{font:400 14px/1.6 "Courier Prime",monospace;color:var(--ember)}
.ppl h3.g{font:400 14px "Courier Prime",monospace;color:var(--ember);margin:32px 0 4px;border-top:1px solid var(--rule);padding-top:12px}
.person{padding:12px 0;border-bottom:1px solid #2a251e}.person b{font:500 23px "EB Garamond",serif}.person span{font:400 14px "Courier Prime",monospace;color:var(--soft);margin-left:10px}.person p{margin:4px 0 0}
.qs{padding-left:1.4em}.qs li{margin:.6em 0}.crd{font:400 13px "Courier Prime",monospace;color:var(--soft);margin-top:28px}
.cover,.cvr,.facts,.kick,.rule,.by{all:unset}
@media(max-width:560px){body{font-size:18px}.toc-row .e{display:none}.tl li,.recrow{grid-template-columns:minmax(0,1fr);gap:2px}}
</style></head><body>
<div class="top"><div class="wrap"><b><a href="/" style="text-decoration:none">The Names He Carried</a></b><select class="jump" id="jump" aria-label="Go to chapter"></select>
<nav class="tabs" aria-label="Sections"><button class="btn" data-go="start">Home</button><button class="btn" data-go="contents">Read the book</button><button class="btn" data-go="records">Records</button><button class="btn" data-go="timeline">Timeline</button><button class="btn" data-go="places">Places</button><button class="btn" data-go="people">People</button><button class="btn" data-go="questions">Open questions</button></nav></div></div>
<main class="wrap" id="view"><p style="text-align:center;margin-top:80px">Opening the book…</p></main>
<script>
{
let CH=[],C=null,last=0;
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const jump=$('#jump');
try{last=+localStorage.getItem('nhc-last')||0}catch(e){}
const lab=c=>/^Chapter/.test(c.label)?c.label.replace('Chapter ','')+'. ':'';
function route(){return `<div class="route"><h3>The places he lived</h3><div class="stops">${C.journey.map(([p,y,w])=>`<div class="stop"><i></i><b>${esc(p)}</b><span>${y} · ${esc(w)}</span></div>`).join('')}</div></div>`}
function home(){return `<section class="hero"><p class="k">A book by Doug Garceau</p><h1>The Names He Carried</h1><p class="sub">The Laurence Brown Douglas Story, 1907 to 1961</p>
<img class="art" src="img/zeppelin-hero.jpg" alt="Ink drawing of a Zeppelin over the rooftops and harbor of Leith at night">
<div class="cta"><button class="btn main" data-go="chapter-${last||1}">${last>1?'Keep reading where you left off':'Read the book'}</button><p class="ded">Dedicated to my mother, Constance Anderson Douglas</p></div></section>${route()}
<div class="sec"><h2>Beside the book</h2><p class="lede">The records behind the story, in one place.</p>
<ul class="tl">${[['records','Records',C.records.length+' register and census entries'],['timeline','Timeline','His life, date by date'],['places','Places','Every address on record'],['people','People','His family and the people of Quothquan'],['questions','Open questions','What the records have not yet answered']].map(([g,t,d])=>`<li><b><button class="lnk" data-go="${g}">${t}</button></b><span>${d}</span></li>`).join('')}</ul></div>`+contents()}
function contents(){let h='<h2 class="toc" id="toc">Contents</h2>',p='';
 for(const c of CH){if(c.part!==p){p=c.part;h+=`<div class="part">${esc(p)}</div>`}
  h+=`<button class="toc-row" data-go="chapter-${c.n}"><span class="n">${lab(c).replace('. ','')}</span><span class="t">${esc(c.title)}</span><span class="e">${esc(c.era)}</span></button>`}
 return h}
function chapter(n){const c=CH[n-1];if(!c)return home();
 try{localStorage.setItem('nhc-last',n)}catch(e){} last=n;
 const pv=CH[n-2],nx=CH[n];
 return `<article class="chap"><div class="pt">${esc(c.part)}</div>${/^Chapter/.test(c.label)?`<div class="no">${esc(c.label)}</div>`:''}<h2>${esc(c.title)}</h2>${c.era?`<p class="era">${esc(c.era)}</p>`:''}${c.html}
 <div class="pager">${pv?`<button class="btn" data-go="chapter-${pv.n}">← ${esc(pv.title)}</button>`:'<button class="btn" data-go="start">← Home</button>'}${nx?`<button class="btn" data-go="chapter-${nx.n}">${esc(nx.title)} →</button>`:'<button class="btn" data-go="contents">Contents</button>'}</div></article>`}
function records(){return `<div class="sec"><h2>Records</h2><p class="lede">The register and census entries behind the story, oldest first.</p>
${C.records.map(r=>`<div class="recrow"><div class="y">${r.year}</div><div><h3>${esc(r.title)}</h3><p>${esc(r.text)}</p><div class="ref">${esc(r.ref)}${r.ch?` · <button class="lnk" data-go="chapter-${r.ch}">Read it in ${esc(r.chl)}</button>`:''}</div>${r.img?`<img loading="lazy" src="${r.img}" alt="${esc(r.title)}">`:''}</div></div>`).join('')}
<p class="crd">Scottish register and census entries are held by the National Records of Scotland.</p></div>`}
function list(title,lede,rows,a,b){return `<div class="sec"><h2>${title}</h2><p class="lede">${lede}</p><ul class="tl">${rows.map(r=>`<li><b>${esc(r[0])}</b><span>${esc(r[1])}</span></li>`).join('')}</ul></div>`}
function people(){let h='<div class="sec ppl"><h2>People</h2><p class="lede">Drawn only from the records and the family\'s own memory.</p>',g='';
 for(const p of C.people){if(p.group!==g){g=p.group;h+=`<h3 class="g">${esc(g)}</h3>`}h+=`<div class="person"><b>${esc(p.name)}</b><span>${esc(p.dates)}</span><p>${esc(p.text)}</p></div>`}
 return h+'</div>'}
function questions(){return `<div class="sec"><h2>Open questions</h2><p class="lede">What the records have not yet answered. If you know something, tell Doug.</p><ol class="qs">${C.questions.map(q=>`<li>${esc(q)}</li>`).join('')}</ol></div>`}
const tabs=['contents','records','timeline','places','people','questions'];
function show(){const h=location.hash.slice(1);let html;const m=h.match(/^chapter-(\d+)$/);
 if(m){html=chapter(+m[1]);jump.value=m[1]}
 else if(h==='records')html=records();
 else if(h==='timeline')html=list('Timeline','His life, date by date, from the records.',C.timeline);
 else if(h==='places')html=list('Places','Every address where the records place him.',C.places);
 else if(h==='people')html=people();
 else if(h==='questions')html=questions();
 else{html=h==='contents'?contents():home();jump.value=''}
 $('#view').innerHTML=html;
 document.querySelectorAll('.tabs .btn').forEach(b=>b.setAttribute('aria-current',String(b.dataset.go===(m?'contents':(h||'start')))));
 scrollTo(0,0)}
document.addEventListener('click',e=>{const im=e.target.closest('.recrow img');if(im){im.classList.toggle('big');return}
 const b=e.target.closest('[data-go]');if(!b)return;const g=b.dataset.go;
 if(g==='start'){if(location.hash)location.hash='';else show();return}
 if(location.hash==='#'+g)show();else location.hash=g});
jump.onchange=()=>{if(jump.value)location.hash='chapter-'+jump.value};
addEventListener('hashchange',show);
Promise.all([fetch('book.json').then(r=>r.json()),fetch('companion.json').then(r=>r.json())]).then(([d,c])=>{CH=d.chapters;C=c;
 jump.innerHTML='<option value="">Go to chapter…</option>'+CH.map(c=>`<option value="${c.n}">${lab(c)}${esc(c.title)}</option>`).join('');show()})
 .catch(()=>{$('#view').innerHTML='<p>The book could not be loaded. Reload the page.</p>'});
}
</script></body></html>
