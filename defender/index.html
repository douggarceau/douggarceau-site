  lives--;                                        // one ship goes straight into play
  startWave(1);state='play';stateT=0;snd('start');
}
function placeShip(){ship.sx=64;ship.y=128;ship.V=0;ship.vy=0;ship.dir=1;ship.alive=true;ship.hyperT=0;}
function startWave(n){
  wave=n;waveParams(n);pal[5]=WCTAB[((n&7)+7)&7];
  if(n>1&&n%5===0){planetAlive=true;hum=[];for(let i=0;i<10;i++)hum.push({x:wrapX((i%4)*512+rnd(480)),y:224,dir:rnd(2)?1:-1,f:0,st:'walk',vy:0,captor:null});}
  objs=[];shells=[];beams=[];exps=[];pops=[];placeShip();
  landersLeft=WP.landers;squadT=0;intraT=0;ufoT=WP.ufotim*15;
  spawnBombers(WP.bombers);spawnPods(WP.pods);

}
function spawnBombers(n){const px=shipWX();for(let i=0;i<n;i++){const sq=Math.floor(i/3),d=sq&1?-1:1;
  objs.push(mkObj('bomber',px+1024+sq*60+(i%3)*12,80,{vx:d*WP.tiexv/32,cruise:64+rnd(41),f:rnd(4)}));}}
function spawnPods(n){for(let i=0;i<n;i++)objs.push(mkObj('pod',shipWX()+400+rnd(1240),YMIN+rnd(180),{vx:(rnd(64)-32)/32,vy:(rnd(2)?1:-1)*(0x20+rnd(32))/256}));}
function spawnMutant(){objs.push(mkObj('mutant',bgl+W+300+rnd(WORLD-W-600),YMIN+rnd(180)));}
function spawnSwarmers(x,y,n){let cnt=objs.filter(o=>o.k==='swarmer').length;
  for(let i=0;i<n&&cnt<20;i++,cnt++)objs.push(mkObj('swarmer',x+rnd(5)-2,y+rnd(5)-2,{vx:(rnd(2)?1:-1)*(1+Math.random()*2),vy:(Math.random()*4-2),dirSet:0}));}
function spawnLander(){
  if(!planetAlive||!hum.some(h=>h.st!=='dead')){appear(mkObj('mutant',rnd(WORLD),44));return;}
  const o=mkObj('lander',rnd(WORLD),44,{vx:(rnd(2)?1:-1)*RMAX(WP.lndxv)/32,cruiseOff:rnd(41)-20,mode:'down',target:null});appear(o);}
function remaining(){let n=landersLeft+resv.landers+resv.mutants+resv.bombers+resv.pods+resv.swarmers;
  for(const o of objs)if(!o.dead&&o.k!=='baiter')n++;return n;}

// ---------------------------------------------------------------- enemy fire (SHOOT)
function shoot(o,sound){
  if(!ship.alive||shells.length>=20)return;const sx=scrX(o.x);if(sx<0||sx>=W||o.y<=YMIN)return;
  let tx=shipWX()+8+(rnd(33)-16)*2,ty=ship.y+3+rnd(33)-16;if(rb()>120)tx+=ship.V/8;
  const dx=wdx(o.x+o.w/2,tx),dy=ty-(o.y+o.h/2);
  shells.push({x:wrapX(o.x+o.w/2),y:o.y+o.h/2,vx:dx*4/256,vy:dy*4/256,life:160,mine:false});
  if(sound)snd(sound);
}

// ---------------------------------------------------------------- kills
function killObj(o,byBomb,cx,cy){
  if(o.dead)return;o.dead=true;
  const s=spr(o);explode(cx!==undefined?cx:o.x+o.w/2,cy!==undefined?cy:o.y+o.h/2,o.k==='swarmer'?SP.swarmX:s);
  switch(o.k){
    case 'lander':addScore(150);snd('landerHit');
      if(o.carry){const h=o.carry;h.st='fall';h.vy=0;h.captor=null;o.carry=null;snd('scream');}
      if(o.target&&o.target.hunter===o)o.target.hunter=null;break;
    case 'mutant':addScore(150);snd('mutantHit');break;
    case 'baiter':addScore(200);snd('baiterHit');break;
    case 'bomber':addScore(250);snd('bomberHit');break;
    case 'pod':addScore(1000);snd('podHit');spawnSwarmers(o.x+2,o.y+2,RMAX(6));break;
    case 'swarmer':addScore(150);snd('swarmerHit');break;
  }
}
function killHuman(h){if(h.st==='dead')return;
  if(h.captor){h.captor.carry=null;h.captor.mode='cruise';h.captor=null;}
  if(h.hunter){h.hunter.target=null;h.hunter=null;}
  h.st='dead';explode(h.x+2,h.y+4,SP.humanX);snd('humanHit');checkPlanet();}
function checkPlanet(){
  if(planetAlive&&!hum.some(h=>h.st!=='dead')){planetAlive=false;planetBlow={round:0,wait:1};
    for(const o of objs)if(o.k==='lander'&&!o.dead){o.k='mutant';o.carry=null;o.f=0;}}
}
function killShip(){if(!ship.alive)return;ship.alive=false;state='dying';deathT=0;snd('death');
  for(const h of hum)if(h.st==='carried'){h.st='fall';h.vy=0;}}

// ---------------------------------------------------------------- per-frame game logic
function updShip(){
  if(ship.hyperT>0){ship.hyperT--;if(ship.hyperT===0&&rb()>192)killShip();return;}
  const L=IN.left(),R=IN.right();
  if(IN.rev())ship.dir*=-1;
  if(L&&!R&&ship.dir===1)ship.dir=-1;
  if(R&&!L&&ship.dir===-1)ship.dir=1;
  ship.thrust=(L&&ship.dir===-1)||(R&&ship.dir===1)||IN.thrust();
  ship.V-=ship.V/64;if(ship.thrust)ship.V+=3*ship.dir;ship.V=clamp(ship.V,-256,256);
  if(IN.up()){ship.vy=ship.vy>=0?-1:Math.max(ship.vy-8/256,-2);}
  else if(IN.down()){ship.vy=ship.vy<=0?1:Math.min(ship.vy+8/256,2);}
  else ship.vy=0;
  ship.y+=ship.vy;if(ship.y<43){ship.y=43;}if(ship.y>238)ship.y=238;
  // screen position: base 64/224 plus V/4 px when moving the way the ship faces
  const fwd=(ship.dir>0&&ship.V>0)||(ship.dir<0&&ship.V<0);
  const tgt=(ship.dir>0?64:224)+(fwd?ship.V/4:0);
  let slide=0;
  if(tgt-ship.sx>2){ship.sx+=2;slide=2;}else if(ship.sx-tgt>2){ship.sx-=2;slide=-2;}else ship.sx=tgt;
  bgl=wrapX(bgl+ship.V/32+slide);
  if(IN.fire()&&beams.length<4)fireLaser();
  if(IN.bomb()&&bombs>0)smartBomb();
  if(IN.hyper())hyperspace();
}
function fireLaser(){
  const y=Math.round(ship.y)+4,x0=ship.dir>0?Math.round(ship.sx)+14:Math.round(ship.sx);
  beams.push({x0,y,dir:ship.dir,head:0,fiz:0,era:0,px:new Uint8Array(W),dead:false});snd('laser');
}
function updBeams(){
  for(const b of beams){
    const prev=b.head;b.head+=8;b.fiz+=6;b.era+=2;
    for(let d=prev;d<b.head;d++){const x=b.x0+b.dir*d;if(x>=0&&x<W)b.px[x]=1;}
    for(let d=b.fiz-6;d<b.fiz&&d<b.head;d++){const x=b.x0+b.dir*d;if(x>=0&&x<W)b.px[x]=rnd(2);}
    for(let d=Math.max(0,b.era-2);d<b.era;d++){const x=b.x0+b.dir*d;if(x>=0&&x<W)b.px[x]=0;}
    const hx=b.x0+b.dir*b.head;
    // collision: 16x1 box around the newest segment
    const a=Math.min(hx,hx-16*b.dir),z=Math.max(hx,hx-16*b.dir);
    let hit=null;
    for(const o of objs){if(o.dead||o.appear)continue;const s=scrX(o.x);
      if(b.y>=o.y&&b.y<o.y+o.h&&s<=z&&s+o.w>=a){hit=o;break;}}
    if(hit){killObj(hit,false,wrapX(bgl+clamp(hx,scrX(hit.x),scrX(hit.x)+hit.w)),b.y);b.dead=true;continue;}
    for(const h of hum){if(h.st==='dead'||h.st==='carried')continue;const s=scrX(h.x);
      if(b.y>=h.y&&b.y<h.y+8&&s<=z&&s+4>=a){killHuman(h);b.dead=true;break;}}
    if(hx>=W||hx<=10)b.dead=true;
  }
  beams=beams.filter(b=>!b.dead);
}
function smartBomb(){bombs--;snd('smart');bgFlash=0;
  for(const o of objs)if(!o.dead&&!o.appear&&onScreen(o.x,o.w))killObj(o,true);}
function hyperspace(){
  shells=[];beams=[];bgl=rnd(WORLD);ship.dir=rnd(2)?1:-1;ship.sx=ship.dir>0?64:224;ship.y=42+rb()/2;ship.V=0;ship.vy=0;
  ship.hyperT=40;snd('appear');scnDirty=true;
}
function updHumans(){
  const slot=(frameN>>1)&15,h0=hum[slot];
  if(h0&&h0.st==='walk'){
    if(rb()<9)h0.dir=-h0.dir;
    h0.x=wrapX(h0.x+h0.dir);h0.f^=1;
    const ty=Math.min(alt(h0.x)+(h0.dir<0?4:15),232);if(h0.y<ty)h0.y++;else if(h0.y>ty)h0.y--;
  }
  for(const h of hum){
    if(h.st==='fall'){if((frameN&3)===0)h.vy=Math.min(h.vy+8/256,3);h.y+=h.vy;
      if(ship.alive&&state==='play'&&hitShip(scrX(h.x),h.y,4,8)){h.st='carried';addScore(500);pop(SP.p500,h);snd('catch');continue;}
      if(h.y>=alt(h.x)+4){h.y=alt(h.x)+4;if(h.vy>0xE0/256)killHuman(h);else{h.st='walk';addScore(250);pop(SP.p250,h);snd('land');}}}
    else if(h.st==='carried'){h.x=wrapX(shipWX()+4);h.y=ship.y+10;
      if(h.y>alt(h.x)){h.st='walk';addScore(500);pop(SP.p500,h);snd('land');}}
  }
}
function hitShip(sx,y,w,h){return ship.alive&&!ship.hyperT&&sx<ship.sx+16&&sx+w>ship.sx&&y<ship.y+6&&y+h>ship.y;}
function vwrap(o){if(o.y<YMIN)o.y=YMAX;else if(o.y>YMAX)o.y=YMIN;}
function updObj(o){
  if(o.appear){o.appear--;return;}
  o.t++;const sx=scrX(o.x),vis=sx+o.w>0&&sx<W,dxs=wdx(o.x,shipWX()),dys=ship.y-o.y;
  switch(o.k){
    case 'lander':{
      if(o.t%6===0)o.f=(o.f+1)%3;
      const ly=WP.lndyv/256;
      if(o.mode==='down'||o.mode==='cruise'){
        o.x=wrapX(o.x+o.vx);
        const cy=clamp(alt(o.x)-50+o.cruiseOff,YMIN+2,200);
        if(o.y<cy-1)o.y+=ly;else if(o.y>cy+1)o.y-=ly;else o.mode='cruise';
        if(!o.target||o.target.st!=='walk'||(o.target.hunter&&o.target.hunter!==o)){
          if(o.target&&o.target.hunter===o)o.target.hunter=null;o.target=null;
          const c=hum.filter(h=>h.st==='walk'&&!h.hunter);
          if(c.length){o.target=c[rnd(c.length)];o.target.hunter=o;}
          else if(!hum.some(h=>h.st!=='dead')){o.k='mutant';o.f=0;break;}
        }
        if(o.target&&(Math.floor(wrapX(o.x+5)/32)===Math.floor(wrapX(o.target.x+2)/32)))o.mode='grab';
        if(vis&&o.t%6===0&&--o.fireT<=0){o.fireT=RMAX(WP.ldstim);shoot(o,'landerShot');}
      }else if(o.mode==='grab'){
        const h=o.target;if(!h||h.st!=='walk'){o.mode='cruise';o.target=null;break;}
        const d=wdx(o.x+3,h.x);if(d)o.x=wrapX(o.x+sgn(d));
        if(o.y<h.y-12)o.y=Math.min(o.y+ly,h.y-12);
        else if(Math.abs(d)<1){h.st='grabbed';h.captor=o;h.hunter=null;o.carry=h;o.mode='rise';snd('pickup');}
        if(vis&&--o.fireT<=0){o.fireT=RMAX(WP.ldstim)*6;shoot(o,'landerShot');}
      }else if(o.mode==='rise'){
        const h=o.carry;if(!h){o.mode='cruise';break;}
        if(o.y>50){o.y-=ly;h.y=o.y+12;h.x=wrapX(o.x+3);}
        else{if(o.mode!=='pull'){o.mode='pull';snd('suck');}}
        if(vis&&(o.t&3)===0&&--o.fireT<=0){o.fireT=RMAX(WP.ldstim);shoot(o,'landerShot');}
      }else if(o.mode==='pull'){
        const h=o.carry;if(!h){o.mode='cruise';break;}
        h.x=wrapX(o.x+3);h.y-=1;if(vis&&(frameN&1))board('BON2');
        if(h.y<=o.y+8){o.carry=null;h.captor=null;killHuman(h);o.k='mutant';o.f=0;}
      }
      break;}
    case 'mutant':{
      if(o.t%3===0){o.vx=sgn(dxs)*WP.szxv/32;
        const close=dxs>=-12&&dxs<=44;
        if(close)o.vy=Math.abs(dys)<1?0:sgn(dys)*WP.szyv/256;
        else o.vy=Math.abs(dys)<8?-sgn(dys||1)*WP.szyv/256:0;
        if(vis)o.y+=(rnd(2)?1:-1)*WP.szry;
        if(vis&&--o.fireT<=0){o.fireT=RMAX(WP.szstim);shoot(o,'mutantShot');}}
      o.x=wrapX(o.x+o.vx);o.y+=o.vy;vwrap(o);break;}
    case 'baiter':{
      if(o.t%6===0)o.f=(o.f+1)%3;
      if(o.t%18===0&&rb()>WP.ufosk)o.aim=0;
      if(!o.aim||o.t%18===0){o.aim=1;const pv=ship.V/32;
        o.vx=Math.abs(dxs)<20?pv:pv+sgn(dxs)*2;
        o.vy=Math.abs(dys)<10?ship.vy/2:(sgn(dys)+ship.vy)/2;}
      o.x=wrapX(o.x+o.vx);o.y+=o.vy;vwrap(o);
      if(vis&&o.t%6===0&&--o.fireT<=0){o.fireT=RMAX(WP.ufstim);shoot(o,'baiterShot');}
      break;}
    case 'bomber':{
      const nf=clamp(o.f+(rnd(3)-1),0,3);o.vy+=(nf-o.f)*0.12;o.f=nf;
      if(vis)o.vy+=sgn(dys)*0.004;else o.vy+=sgn(o.cruise-o.y)*0.01;
      o.vy=clamp(o.vy*0.98,-0.6,0.6);o.x=wrapX(o.x+o.vx);o.y+=o.vy;vwrap(o);break;}
    case 'pod':o.x=wrapX(o.x+o.vx);o.y+=o.vy;vwrap(o);break;
    case 'swarmer':{
      if(o.t%3===0){
        const passed=sgn(dxs)!==sgn(o.vx)&&Math.abs(dxs)>150;
        if(!o.dirSet||passed){o.vx=sgn(dxs)*WP.swxv/32;o.dirSet=1;}
        o.vy+=sgn(dys)*(rb()&WP.swac)/256;o.vy=clamp(o.vy,-2,2);
        if(vis&&sgn(o.vx)===sgn(dxs)&&--o.fireT<=0){o.fireT=RMAX(WP.swstim);shoot(o,'swarmerShot');}}
      o.vy-=o.vy/64;o.vy+=(rnd(33)-16)/256;
      o.x=wrapX(o.x+o.vx);o.y+=o.vy;vwrap(o);break;}
  }
}
function updWave(){
  // lander squads
  squadT--;
  const alive=objs.filter(o=>!o.dead&&o.k==='lander').length;
  if((resv.landers+landersLeft)>0&&alive<8&&(squadT<=0||alive===0)){
    if(resv.landers>0){const n=Math.min(WP.wavsiz,resv.landers);resv.landers-=n;for(let i=0;i<n;i++)spawnLander();}
    else{const n=Math.min(WP.wavsiz,landersLeft);landersLeft-=n;for(let i=0;i<n;i++)spawnLander();}
    squadT=WP.wavtim*15;
  }
  if(resv.mutants>0){resv.mutants--;spawnMutant();}
  if(resv.bombers>0){spawnBombers(resv.bombers);resv.bombers=0;}
  if(resv.pods>0){spawnPods(resv.pods);resv.pods=0;}
  if(resv.swarmers>0){const n=Math.min(6,resv.swarmers);resv.swarmers-=n;spawnSwarmers(wrapX(bgl+W+200+rnd(800)),YMIN+rnd(180),n);}
  if(++intraT>=600){intraT=0;intraWave();}
  // baiters
  if(frameN%15===0){const rem=remaining();
    if(rem<=3)ufoT=Math.min(ufoT,(WP.ufotim/4+1)*15);else if(rem<=8)ufoT=Math.min(ufoT,(WP.ufotim/2+1)*15);}
  if(--ufoT<=0){const rem=remaining();
    if(objs.filter(o=>o.k==='baiter').length<12)appear(mkObj('baiter',bgl+((rb()&31)*256+rb())/32,42+rb()/2));
    ufoT=(rem<4?RMAX(WP.ufotim/4):WP.ufotim)*15;}
  // bombers drop mines: one random bomber per frame, 1 in 8
  const bs=objs.filter(o=>o.k==='bomber'&&!o.dead&&!o.appear&&onScreen(o.x,o.w));
  if(bs.length&&rnd(8)===0&&shells.filter(s=>s.mine).length<10&&shells.length<20){const b=bs[rnd(bs.length)];
    shells.push({x:wrapX(b.x+2),y:b.y+3,vx:0,vy:0,life:(1+rnd(32))*8,mine:true});}
}
function updShells(){
  for(const s of shells){s.x=wrapX(s.x+s.vx);s.y+=s.vy;s.life--;const sx=scrX(s.x);
    if(s.life<=0||s.y<YMIN||(!s.mine&&(sx<0||sx>=W)))s.dead=true;
    else if(hitShip(sx-1,s.y-1,s.mine?4:3,3)){s.dead=true;explode(s.x,s.y,SP.bulletX);snd('humanHit');addScore(25);killShip();}}
  shells=shells.filter(s=>!s.dead);
}
function collide(){
  if(!ship.alive)return;
  for(const o of objs){if(o.dead||o.appear)continue;if(hitShip(scrX(o.x),o.y,o.w,o.h)){killObj(o,false);killShip();return;}}
}
function updPlanetBlow(){
  const p=planetBlow;if(!p)return;if(--p.wait>0)return;
  if(p.round>=16){planetBlow=null;snd('planet');return;}
  for(let i=0;i<2;i++){const x=wrapX(bgl+rnd(W));explode(x,alt(x),SP.terex);}
  bgFlash=100+COLTAB[rnd(36)];snd('humanHit');p.round++;p.wait=1+RMAX(p.round>>3)+1;
}
function play(){
  updShip();if(state!=='play')return;
  updBeams();
  for(const o of objs)if(!o.dead)updObj(o);
  objs=objs.filter(o=>!o.dead);
  updHumans();updShells();collide();updWave();updPlanetBlow();
  if(state==='play'&&remaining()===0&&!planetBlow){state='bonus';bonusT=0;bonusShown=0;
    bonusN=planetAlive?hum.filter(h=>h.st!=='dead').length:0;
    for(const h of hum)if(h.st==='carried'||h.st==='fall'||h.st==='grabbed'){h.st='walk';h.y=alt(h.x)+4;}}
}
function dying(){
  deathT++;
  if(deathT===33)bgFlash=0x1FF;                     // 2-frame white flash
  if(deathT===35){const cx=shipWX()+8,cy=ship.y+3;shards=[];
    while(shards.length<128){const vx=(Math.random()*2-1)*2,vy=(Math.random()*2-1)*2;if(Math.abs(vx)/2+Math.abs(vy)/2<1.41)shards.push({x:cx,y:cy,vx,vy});}
    pal[11]=0xFF;}
  if(deathT>35){for(const s of shards){s.x=wrapX(s.x+s.vx);s.y+=s.vy;}
    const t=deathT-35;if(t>=56){const k=(t-56)>>2;pal[11]=k<PXCOL.length?PXCOL[k]:0;}
    if(t===56+PXCOL.length*4){board('BGEND');}}
  for(const e of exps){e.size+=e.grow;}exps=exps.filter(e=>e.size<=48);
  if(deathT>=35+56+PXCOL.length*4+30){
    shards=[];
    if(lives<=0){state='gameover';stateT=0;return;}
    lives--;
    // surviving enemies go back into reserve and re-enter (PLSAV)
    for(const o of objs){if(o.k==='lander'){resv.landers++;if(o.carry){o.carry.st='walk';o.carry.captor=null;o.carry.y=alt(o.carry.x)+4;}}
      else if(o.k==='mutant')resv.mutants++;else if(o.k==='bomber')resv.bombers++;else if(o.k==='pod')resv.pods++;else if(o.k==='swarmer')resv.swarmers++;}
    for(const h of hum){h.hunter=null;if(h.st==='grabbed'){h.st='walk';h.captor=null;}}
    objs=[];shells=[];beams=[];pops=[];placeShip();squadT=60;
    if(remaining()===0){state='bonus';bonusT=0;bonusShown=0;bonusN=planetAlive?hum.filter(h=>h.st!=='dead').length:0;}
    else state='play';
  }
}
function bonus(){
  bonusT++;
  if(bonusT>40&&bonusShown<bonusN&&(bonusT-40)%4===0){bonusShown++;addScore(100*Math.min(wave,5));}
  if(bonusT>40+bonusN*4+128){startWave(wave+1);state='play';}
}

// ---------------------------------------------------------------- palette processes
function palTick(){
  if((frameN&1)===0)colIdx=(colIdx+1)%COLTAB.length;
  pal[1]=col1Fixed>=0?col1Fixed:COLTAB[colIdx];
  cbombT=(cbombT+1)%9;
  if(cbombT===0){pal[10]=0xFF;pal[12]=0;}else if(cbombT===3){pal[10]=pal[12]=COLTAB[rb()&31];}
  if(frameN%6===0){tieIdx=(tieIdx+1)%3;pal[13]=TCTAB[tieIdx][0];pal[14]=TCTAB[tieIdx][1];pal[15]=TCTAB[tieIdx][2];}
  if(frameN%4===0)flameIdx=(flameIdx+1)&63;
  // stars
  const s=stars[rnd(16)];s.c=(s.c+1)&7;
  if(rnd(30)===0){const t=stars[rnd(16)];t.x=rnd(312);if(!planetAlive)t.y=42+3*(rb()&63);}
}
let lastBgl=0;
function scrollStars(){let d=wdx(lastBgl,bgl);lastBgl=bgl;if(Math.abs(d)>40)d=0;
  for(const s of stars){s.x-=d/2;if(s.x<0)s.x+=312;if(s.x>=312)s.x-=312;}}

// ---------------------------------------------------------------- scanner
const BLIP={lander:[4,4,3,3],mutant:[12,12,3,3],baiter:[3,3,3,3],bomber:[8,8,8,8],pod:[12,12,12,12],swarmer:[2,4,2,4],human:[6,6,6,6]};
function buildScanner(){
  scnBuf.fill(0);const left=wrapX(bgl+152-1024);
  const put=(wx,y,c)=>{const col=Math.floor(wrapX(wx-left)/32);if(col<0||col>63)return;const r=Math.floor(y/8)-1;if(r<0||r>31)return;
    const x=col*2;for(let k=0;k<4;k++){const xx=x+(k&1),yy=r+(k>>1);if(yy<32&&c[k])scnBuf[yy*128+xx]=c[k];}};
  if(planetAlive)for(let col=0;col<64;col++)for(let i=0;i<2;i++){const wx=left+col*32+i*16,r=Math.floor(alt(wx)/8)-1;if(r>=0&&r<32)scnBuf[r*128+col*2+i]=7;}
  for(const h of hum)if(h.st!=='dead')put(h.x,h.y,BLIP.human);
  for(const o of objs)if(!o.dead&&!o.appear)put(o.x,o.y,BLIP[o.k]);
  if(state==='attract'&&page===1&&demo){const d=demo;
    if(d.ph==='rescue'){put(d.man.x,d.man.y,BLIP.human);if(!d.lander.dead&&!d.lander.appear)put(d.lander.x,d.lander.y,BLIP.lander);}
    else if(d.o&&!d.o.dead&&!d.o.appear)put(d.o.x,d.o.y,BLIP[d.o.k]);
    for(const q of d.done)if(!q.appear)put(q.x,q.y,BLIP[q.k]);}
  scnDirty=false;
}
function drawScanner(withShip){
  const c5=5;
  hline(0,W-1,40,c5);hline(0,W-1,41,c5);
  for(let y=8;y<=39;y++){pset(94,y,c5);pset(95,y,c5);pset(224,y,c5);pset(225,y,c5);}
  hline(94,225,7,c5);
  for(let y=0;y<32;y++)for(let x=0;x<128;x++){const c=scnBuf[y*128+x];if(c)pset(96+x,8+y,c);}
  hline(152,167,7,9);hline(152,167,8,9);hline(152,167,40,9);hline(152,167,41,9);
  for(const y of [9,10,38,39]){pset(152,y,9);pset(167,y,9);}
  if(withShip&&(ship.alive||frameN&4)){const X=150+2*Math.floor(ship.sx/32)+1,r=7+Math.floor(ship.y/8);pset(X,r,9);pset(X-1,r+1,9);pset(X,r+1,9);pset(X+1,r+1,9);pset(X,r+2,9);}
}
function drawHud(){
  for(let i=0;i<Math.min(lives,5);i++)blit(SP.mini,30+12*i,20);
  for(let i=0;i<Math.min(bombs,3);i++)blit(SP.sbomb,82,27+4*i);
  const flash=!scored&&state==='play'&&(frameN%20)<8;
  if(!flash){const s=String(score);for(let i=0;i<6;i++){const k=s.length-6+i;const ch=k>=0?s[k]:(i>=4?'0':'');if(ch)blit(GLY[ch],30+8*i,28,0,1);}}
}

// ---------------------------------------------------------------- world drawing
function drawStars(){for(const s of stars)if(s.c&&s.x<W)pset(s.x,s.y,s.c);}
function drawTerrain(){if(!planetAlive)return;for(let x=0;x<W;x++)pset(x,alt(bgl+x),7);}
function drawAppear(o){const s=spr(o),bl=blocksOf(s),size=o.appear,cx=scrX(o.x)+o.w/2,cy=o.y+o.h/2;
  for(const b of bl){const bx=cx+b.ox*size+b.ox,by=cy+b.oy*size+b.oy;for(let k=0;k<4;k++)if(by+(k>>1)>=YMIN)pset(bx+(k&1),by+(k>>1),b.p[k]);}}
function drawExps(){for(const e of exps){const cx=scrX(e.x);if(cx<-400||cx>W+400)continue;
  for(const b of e.bl){const bx=cx+b.ox*e.size,by=e.y+b.oy*e.size;for(let k=0;k<4;k++){const yy=by+(k>>1);if(yy>=YMIN)pset(bx+(k&1),yy,b.p[k]);}}}}
function drawShip(){
  const x=Math.round(ship.sx),y=Math.round(ship.y);
  if(ship.hyperT>0){const s=ship.dir>0?SP.shipR:SP.shipL,size=ship.hyperT;for(const b of blocksOf(s)){const bx=x+8+b.ox*size+b.ox,by=y+3+b.oy*size+b.oy;for(let k=0;k<4;k++)pset(bx+(k&1),by+(k>>1),b.p[k]);}return;}
  blit(ship.dir>0?SP.shipR:SP.shipL,x,y);
  const fl=(cx,y0,y1)=>{for(let yy=y0;yy<=y1;yy++){const b=flameTab[(flameIdx+yy+cx)&63];pset(cx,yy,b>>4);pset(cx+1,yy,b&15);}};
  if(ship.dir>0){fl(x-2,y+1,y+5);if(ship.thrust){fl(x-4,y+2,y+4);fl(x-6,y+2,y+4);fl(x-8,y+3,y+3);}}
  else{fl(x+16,y+1,y+5);if(ship.thrust){fl(x+18,y+2,y+4);fl(x+20,y+2,y+4);fl(x+22,y+3,y+3);}}
}
function drawWorld(){
  drawStars();drawTerrain();
  for(const h of hum){if(h.st==='dead')continue;const s=scrX(h.x);if(s<-4||s>W)continue;
    blit((h.dir<0?SP.humanL:SP.humanR)[h.f&1],s,h.y,YMIN);}
  for(const o of objs){if(o.dead)continue;const s=scrX(o.x);if(s<-o.w-60||s>W+60)continue;
    if(o.appear)drawAppear(o);else blit(spr(o),s,o.y,YMIN);}
  for(const sh of shells){const s=scrX(sh.x);if(s<-4||s>W)continue;
    if(sh.mine)blit(SP.mine[cbombT<5?0:1],s-2,sh.y-1,YMIN);
    else{const r=flameTab[(flameIdx*3+(sh.x|0))&63];const c=k=>((r>>k)&1)?9:10;
      pset(s,sh.y-1,c(0));pset(s-1,sh.y,c(1));pset(s,sh.y,c(2));pset(s+1,sh.y,c(3));pset(s,sh.y+1,c(4));}}
  for(const b of beams){for(let x=0;x<W;x++)if(b.px[x])pset(x,b.y,1);const hx=b.x0+b.dir*b.head;pset(hx-b.dir,b.y,9);pset(hx-2*b.dir,b.y,9);}
  if(state==='dying'){
    if(deathT<33){const k=deathT>>2;if((deathT&2)===0){pal[11]=PXCTB[Math.min(k,7)];const s=ship.dir>0?SP.shipR:SP.shipL;blit(s,ship.sx,ship.y,0,11);}}
    else if(deathT>=35)for(const s of shards){const x=scrX(s.x);if(s.y>=YMIN&&x<W)for(let k=0;k<4;k++)pset(x+(k&1),s.y+(k>>1),11);}
  }else if(ship.alive)drawShip();
  drawExps();
  for(const p of pops)blit(p.s,p.sx,p.y,YMIN);
}

// ---------------------------------------------------------------- attract mode
function attractInit(){state='attract';page=0;pageT=0;col1Fixed=-1;pal[5]=WCTAB[0];pal[12]=0x3F;HOF.refresh();}
function drawHofTable(list,xr,xi,xs){
  list.forEach((r,k)=>{const y=134+10*k;txt(String(k+1),xr,y);txt(r[0].replace(/ /g,'@'),xi,y);
    const s=String(r[1]);txt(s,xs+(6-s.length)*8,y);});}
function attract(){
  pageT++;
  if(IN.start()){snd('coin');setTimeout(()=>{},0);newGame();return;}
  if(page===0&&pageT>600){page=1;pageT=0;demoInit();}
  else if(page===1&&demoStep()){page=2;pageT=0;}
  else if(page===2&&pageT>900){page=0;pageT=0;HOF.refresh();}
  if(page===1){for(const e of exps)e.size+=e.grow;exps=exps.filter(e=>e.size<=48);}
}
function drawAttract(){
  if(page===0){
    pal[12]=0x3F;blit(LOGO,96,56);
    txt('HALL OF FAME',112,84);txt('TODAYS',68,104);txt('ALL TIME',192,104);txt('GREATEST',60,114);txt('GREATEST',190,114);
    hline(60,121,123,1);hline(60,121,124,1);hline(190,251,123,1);hline(190,251,124,1);
    drawHofTable(HOF.today(),48,58,86);drawHofTable(HOF.all(),178,188,216);
  }else if(page===1)drawDemo();
  else{
    // title page: the DEFENDER letters build in, then flash (CBOMB on colour C)
    const t=pageT;
    if(t<48){}else if(t<95){const size=95-t;LOGOSL.forEach((bl,i)=>{const cx=96+8*i+4;for(const b of bl){const bx=cx+b.ox*size+b.ox,by=156+b.oy*size+b.oy;for(let k=0;k<4;k++)pset(bx+(k&1),by+(k>>1),b.p[k]);}});}
    else blit(LOGO,96,144);
    if(t<135)pal[12]=0x3F;
    tinyTxtC('CODED AND BUILT BY DOUG GARCEAU',202,1);
    txtC('ARROWS FLY  SPACE FIRE  B SMART BOMB',214,1);
    txtC('H HYPERSPACE  P PAUSE  M MUTE',224,1);
  }
  if((frameN>>5)&1)txtC('PRESS ENTER TO START',236);
}
const LOGOSL=[];for(let i=0;i<15;i++){const d=new Uint8Array(8*24);for(let y=0;y<24;y++)for(let x=0;x<8;x++)d[y*8+x]=LOGO.d[y*120+8*i+x];LOGOSL.push(blocksOf({w:8,h:24,d}));}
const ROLL=[['lander',72,96,'LANDER','150',56,112,68,122],['mutant',136,96,'MUTANT','150',120,112,132,122],['baiter',204,98,'BAITER','200',190,112,202,122],
 ['bomber',74,152,'BOMBER','250',56,168,68,178],['pod',138,152,'POD','1000',132,168,128,178],['swarmer',206,154,'SWARMER','150',184,168,200,178]];
function demoBeam(){beams.push({x0:Math.round(ship.sx)+14,y:Math.round(ship.y)+4,dir:1,head:0,fiz:0,era:0,px:new Uint8Array(W),dead:false});}
function demoBeams(target,onHit){
  for(const b of beams){const prev=b.head;b.head+=8;b.fiz+=6;b.era+=2;
    for(let k=prev;k<b.head;k++){const x=b.x0+k;if(x<W)b.px[x]=1;}
    for(let k=b.fiz-6;k<b.fiz&&k<b.head;k++){const x=b.x0+k;if(x>=0&&x<W)b.px[x]=rnd(2);}
    for(let k=Math.max(0,b.era-2);k<b.era;k++){const x=b.x0+k;if(x<W)b.px[x]=0;}
    const hx=b.x0+b.head;
    if(target&&!target.dead&&!target.appear&&hx>=target.x&&b.y>=target.y&&b.y<target.y+target.h){b.dead=true;onHit();}
    if(hx>=W)b.dead=true;}
  beams=beams.filter(b=>!b.dead);
}
function demoInit(){
  bgl=0;objs=[];exps=[];beams=[];shells=[];pops=[];planetAlive=true;
  ship.sx=64;ship.y=80;ship.dir=1;ship.V=0;ship.alive=true;ship.hyperT=0;ship.thrust=false;
  // humanoid-rescue scene (amode1.src:491-615), then the enemy roll call
  demo={ph:'rescue',t:0,i:0,labels:0,done:[],man:{x:240,y:219,vy:0,dir:1,f:0},
    lander:mkObj('lander',237,64,{appear:47}),p500:null};
  hum=[];scnDirty=true;
}
function demoStep(){
  const d=demo;d.t++;
  for(const q of d.done)if(q.appear)q.appear--;
  if(d.ph==='rescue'){
    const L=d.lander,m=d.man,t=d.t;
    if(L.appear){L.appear--;if(!L.appear)d.t=0;return false;}
    if(t%6===0)L.f=(L.f+1)%3;
    if(t<=230){L.y+=0.625;}                                         // lander descends to the man
    else if(t<=390+21&&!L.dead){L.y-=0.6875;m.y=L.y+11;if(t===391)demoBeam();}   // both rise; laser fires
    if(t>390)demoBeams(L,()=>{L.dead=true;explode(L.x+5,L.y+4,spr(L));d.hitT=t;});
    if(L.dead){const k=t-d.hitT;
      if(k<=88){ship.sx+=2;ship.y+=212/256;if(!m.caught){if(k%2===0)m.vy+=8/256;m.y+=m.vy;
          if(m.y>=ship.y+8&&Math.abs(m.x-(ship.sx+4))<10){m.caught=true;d.p500={x:239,y:144};}}}
      else if(k<=168){if(!m.caught){m.caught=true;d.p500={x:239,y:144};}ship.y+=0.75;}
      else if(k<=264){d.p500={x:224,y:224};ship.dir=-1;ship.sx-=2;ship.y-=1.5;m.caught=false;m.y=219;}
      else{ship.dir=1;d.p500=null;ship.sx=64;ship.y=80;d.ph='roll';d.t=0;beams=[];}
      if(m.caught){m.x=ship.sx+4;m.y=Math.min(ship.y+10,219);}}
    return false;
  }
  if(d.i>=ROLL.length)return d.t>510;
  const r=ROLL[d.i];
  if(d.t===1){d.o=mkObj(r[0],248,160,{appear:47});d.hit=0;}
  const o=d.o;
  if(o.appear)o.appear--;else if(!o.dead){o.y-=0.75;if(o.t++%6===0)o.f++;}
  if(d.t===47+95)demoBeam();
  if(d.t>=47+95)demoBeams(o,()=>{o.dead=true;explode(o.x+o.w/2,o.y+o.h/2,spr(o));d.hit=d.t;});
  if(!o.dead&&d.t>47+95+60){o.dead=true;explode(o.x+o.w/2,o.y+o.h/2,spr(o));d.hit=d.t;}
  if(o.dead&&d.t===d.hit+1)d.done.push(mkObj(r[0],r[1],r[2],{appear:47}));
  if(o.dead&&d.t===d.hit+32)d.labels++;
  if(o.dead&&d.t>=d.hit+64){d.i++;d.t=0;}
  return false;
}
function drawDemo(){
  drawStars();drawTerrain();
  txt('SCANNER',134,48);
  const d=demo;if(!d)return;
  blit(ship.dir>0?SP.shipR:SP.shipL,ship.sx,ship.y);
  if(d.ph==='rescue'){const L=d.lander;if(!L.dead){if(L.appear)drawAppear(L);else blit(spr(L),L.x,L.y);}
    blit(SP.humanR[0],d.man.x,d.man.y);if(d.p500)blit(SP.p500,d.p500.x,d.p500.y);}
  else{if(d.o&&!d.o.dead){if(d.o.appear)drawAppear(d.o);else blit(spr(d.o),d.o.x,d.o.y);}}
  for(const q of d.done){if(q.appear)drawAppear(q);else blit(spr(q),q.x,q.y);}
  for(let i=0;i<d.labels;i++){const r=ROLL[i];txt(r[3],r[5],r[6]);txt(r[4],r[7],r[8]);}
  for(const b of beams){for(let x=0;x<W;x++)if(b.px[x])pset(x,b.y,1);const hx=b.x0+b.head;pset(hx-1,b.y,9);pset(hx-2,b.y,9);}
  drawExps();
}
// ---------------------------------------------------------------- high score entry
const LET='@ABCDEFGHIJKLMNOPQRSTUVWXYZ';
function initialsKey(e){
  if(e.repeat)return true;
  if(/^Key[A-Z]$/.test(e.code)){initials[initIdx]=e.code[3];initIdx++;}
  else if(e.code==='Backspace'){initIdx=Math.max(0,initIdx-1);}
  else if(e.code==='Enter'||e.code==='Space'){initIdx++;}
  else return false;
  if(initIdx>=3)commitInitials();return true;
}
function commitInitials(){HOF.submit(initials.join('').replace(/@/g,' ').trimEnd()||'@',score,wave);attractInit();}
function initialsUpd(){
  stateT++;const up=IN.up(),dn=IN.down();
  if(up||dn){initRpt--;if(initRpt<=0){const i=LET.indexOf(initials[initIdx]);initials[initIdx]=LET[(i+(up?1:LET.length-1))%LET.length];
      initRpt=initRpt<0?3:(initRpt===0?32:Math.floor(initRpt/2)+5);if(initRpt>40)initRpt=32;}}
  else initRpt=-1;
  if(JP('GPfire','Tfire','KeyJ','KeyF')){initIdx++;if(initIdx>=3)commitInitials();}
  pal[13]=(frameN%30)<15?0:pal[1];
  if(stateT>60*60)commitInitials();
}
function drawInitials(){
  txt('PLAYER ONE',124,56);txt('YOU HAVE QUALIFIED FOR',40,88);txt('THE DEFENDER HALL OF FAME',40,98);
  txt('SELECT INITIALS WITH UP DOWN STICK',40,118);txt('PRESS FIRE TO ENTER INITIAL',40,138);
  for(let i=0;i<3;i++){const x=140+16*i;txt(initials[i],x,172);const c=i===initIdx?13:1;hline(x,x+7,183,c);hline(x,x+7,184,c);}
}

// ---------------------------------------------------------------- main update / render
function update(){
  pollPad();frameN++;
  if(JP('KeyM'))toggleMute();
  if(JP('KeyF')&&state!=='play'&&state!=='initials')fullscreen();
  if(JP('KeyP','Escape')&&(state==='play'||paused))paused=!paused;
  if(paused){jp.clear();sndTick(false);return;}
  palTick();
  const gb=state==='play'||state==='dying';
  switch(state){
    case 'attract':attract();break;
    case 'play':play();break;
    case 'dying':dying();break;
    case 'bonus':bonus();break;
    case 'gameover':if(++stateT>60){board('BGEND');if(HOF.qualifies(score)){state='initials';stateT=0;initials=['A','@','@'];initIdx=0;col1Fixed=0x85;}else attractInit();}break;
    case 'initials':initialsUpd();break;
  }
  if(state==='play'||state==='dying'){for(const e of exps)e.size+=e.grow;exps=exps.filter(e=>e.size<=48);
    for(const p of pops){p.sx-=ship.V/32;p.life--;}pops=pops.filter(p=>p.life>0);}
  if(gb||state==='bonus')scrollStars();
  if(frameN%8===0||scnDirty)buildScanner();
  sndTick(state==='play'&&ship.alive&&ship.thrust);
  if(homeEl)homeEl.hidden=state!=='attract';
  jp.clear();
}
function render(){
  fb.fill(0);
  if(state==='attract')drawAttract();
  else if(state==='initials')drawInitials();
  else{
    drawScanner(state!=='bonus');drawHud();
    if(state==='bonus'){
      txt(String(wave),txt('ATTACK WAVE',112,80)+2,80);txt('COMPLETED',122,96);
      txt(String(100*Math.min(wave,5)),txt('BONUS X',120,144)+2,144);
      for(let i=0;i<bonusShown;i++)blit(SP.humanR[0],120+8*i,160);
    }else{drawWorld();
      if(state==='gameover')txt('GAME OVER',124,128);
      if(paused){txtC('PAUSED',120);}}
  }
  if(state==='attract'&&page===1){drawScanner(false);drawHud();}
  // background colour: smart-bomb inversions, death flash, planet lightning
  let bg=0;
  if(bgFlash>=0&&bgFlash<8){bg=(bgFlash>>1)%2===0?0xFF:0;bgFlash++;if(bgFlash>=8)bgFlash=-1;}
  else if(bgFlash===0x1FF){bg=0xFF;bgFlash=0x1FE;}else if(bgFlash===0x1FE){bg=0xFF;bgFlash=-1;}
  else if(bgFlash>=100){bg=bgFlash-100;bgFlash=bgFlash>=100&&bgFlash<0x1FE?-2:bgFlash;}
  else if(bgFlash===-2){bg=0;bgFlash=-1;}
  pal[0]=bg;
  const P=new Uint32Array(16);for(let i=0;i<16;i++)P[i]=RGBA[pal[i]];
  for(let i=0;i<fb.length;i++)px32[i]=P[fb[i]];
  ctx.putImageData(img,0,0);
}
const homeEl=document.getElementById('home');
let last=performance.now(),acc=0;
function frame(now){acc+=Math.min(120,now-last);last=now;while(acc>=1000/60){update();acc-=1000/60;}render();requestAnimationFrame(frame);}
function start(){attractInit();page=2;pageT=0;cv.focus({preventScroll:true});requestAnimationFrame(frame);}
start();
</script>
