<style>
:root{--bg:#0a0a0a;--ink:#fff;--muted:#c4c4c4;--line:#2e2e2e;--gold:#ffd35c}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'IBM Plex Sans',system-ui,sans-serif;font-size:17px;line-height:1.6}
a{color:var(--gold)}
.wrap{max-width:820px;margin:0 auto;padding:18px 16px 90px}
nav.top{font-size:15px;padding:4px 0 14px}nav.top a{text-decoration:none}
.kicker{font-family:'IBM Plex Mono',monospace;font-size:13px;letter-spacing:4px;color:var(--muted);margin:6px 0 4px}
h1{font-family:'Bebas Neue',Impact,sans-serif;font-weight:400;font-size:clamp(48px,9vw,86px);line-height:.92;margin:0 0 12px;letter-spacing:1px}
h1 span{color:var(--gold)}
.lead{color:var(--muted);margin:0 0 22px;font-size:19px}
.why{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:0 0 22px}
.why button{background:#141414;border:1px solid var(--line);color:#fff;border-radius:10px;padding:14px 10px;font:700 13px 'IBM Plex Mono',monospace;letter-spacing:.08em;cursor:pointer;text-transform:uppercase}
.why button.on{border-color:var(--gold);background:#2a2412;color:var(--gold);box-shadow:0 0 14px rgba(255,211,92,.35)}
form{display:grid;gap:14px;background:#111;border:1px solid var(--line);border-radius:14px;padding:20px}
label{display:grid;gap:5px;font:600 12px 'IBM Plex Mono',monospace;letter-spacing:.14em;color:#9a9a93;text-transform:uppercase}
input,textarea,select{font:16px 'IBM Plex Sans',sans-serif;background:#0a0a0a;color:#fff;border:1px solid #3a3a3a;border-radius:8px;padding:12px}
textarea{min-height:170px;resize:vertical}
.row{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.send{background:var(--gold);color:#0a0a0a;border:0;border-radius:9px;padding:15px;font:700 15px 'IBM Plex Mono',monospace;letter-spacing:.14em;cursor:pointer}
.send[disabled]{opacity:.6}
.note{min-height:1.4em;font-size:15px}.note.ok{color:#7dff9a}.note.bad{color:#ffb38a}
.hp{position:absolute;left:-9999px}
.fine{color:#8d8b85;font-size:13.5px;margin-top:16px}
@media(max-width:650px){.why{grid-template-columns:1fr 1fr}.row{grid-template-columns:1fr}}
</style>
<link rel="manifest" href="/manifest.webmanifest"><meta name="theme-color" content="#0a0a0a"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Amadeus Drums"><link rel="apple-touch-icon" href="/apple-touch-icon.png">
<script src="/assets/app.js?v=2" defer></script>

<body>
<div class="wrap">
<nav class="top"><a href="/">&larr; Amadeus School of Drums</a></nav>
<div class="kicker">CONTACT THE WEBMASTER</div>
<h1>GET IN <span>TOUCH</span></h1>
<p class="lead">Advertising, a story idea, an interview request, or feedback on the site. Pick one and send a note.</p>
<div class="why" role="group" aria-label="Reason">
<button type="button" data-r="Advertising">Advertising</button>
<button type="button" data-r="Story idea">Story idea</button>
<button type="button" data-r="Interview request">Interview request</button>
<button type="button" data-r="Feedback">Feedback</button>
</div>
<form id="cf" novalidate>
<label>Reason<select name="reason" id="reason"><option>Advertising</option><option>Story idea</option><option>Interview request</option><option>Feedback</option></select></label>
<div class="row"><label>Your name<input name="name" id="nm" autocomplete="name" maxlength="80" required></label>
<label>Your email (for a reply)<input name="email" id="em" type="email" autocomplete="email" maxlength="120" required></label></div>
<label class="co" id="colab">Company or outlet (optional)<input name="company" maxlength="100"></label>
<label>Message<textarea name="message" id="msg" maxlength="5000" required></textarea></label>
<input class="hp" name="_honey" tabindex="-1" autocomplete="off" aria-hidden="true">
<button class="send" type="submit">SEND MESSAGE &rarr;</button>
<div class="note" id="note" role="status"></div>
</form>
<p class="fine">Your message goes straight to the webmaster. Your email is only used to reply to you.</p>
</div>
<script>
(function(){
var R=document.getElementById('reason'),btns=document.querySelectorAll('.why button');
function pick(r){R.value=r;btns.forEach(function(b){b.classList.toggle('on',b.dataset.r===r);});}
btns.forEach(function(b){b.onclick=function(){pick(b.dataset.r);document.getElementById('msg').focus();};});
R.onchange=function(){pick(R.value);};
var q=(new URLSearchParams(location.search).get('r')||'').toLowerCase(),map={advertising:'Advertising',story:'Story idea',interview:'Interview request',feedback:'Feedback'};
pick(map[q]||'Feedback');
var to=['doug','garceau'].join('')+'@'+['gmail','com'].join('.');
// After FormSubmit activation, replace KEY with the random code it gives you so the address never appears.
var KEY='';
var F=document.getElementById('cf'),N=document.getElementById('note');
F.addEventListener('submit',function(e){
 e.preventDefault();
 var d=Object.fromEntries(new FormData(F));
 if(d._honey)return;
 if(!d.name.trim()||!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(d.email)||d.message.trim().length<5){N.className='note bad';N.textContent='Please fill in your name, a valid email and a message.';return;}
 var b=F.querySelector('.send');b.disabled=true;N.className='note';N.textContent='Sending...';
 var subj='[douggarceau.com] '+d.reason+' from '+d.name;
 fetch('https://formsubmit.co/ajax/'+(KEY||to),{method:'POST',headers:{'Content-Type':'application/json',Accept:'application/json'},
  body:JSON.stringify({_subject:subj,_template:'table',_captcha:'false',_replyto:d.email,Reason:d.reason,Name:d.name,Email:d.email,Company:d.company||'',Message:d.message})})
 .then(function(r){return r.json();}).then(function(j){
  if(String(j.success)==='true'){N.className='note ok';N.textContent='Thanks, '+d.name.split(' ')[0]+'! Your message was sent.';F.reset();pick(d.reason);if(window.gtag)gtag('event','contact_sent',{reason:d.reason});}
  else throw 0;
 }).catch(function(){
  N.className='note bad';N.textContent='The form could not send right now. Opening your email app instead...';
  setTimeout(function(){location.href='mai'+'lto:'+to+'?subject='+encodeURIComponent(subj)+'&body='+encodeURIComponent(d.message+'\n\n'+d.name+(d.company?' / '+d.company:''));},900);
 }).finally(function(){b.disabled=false;});
});
})();
</script>
<script src="/assets/hype.js?v=7" defer></script>
</body>
</html>
