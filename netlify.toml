[build]
  publish = "."
[[redirects]]
from = "/success"
to = "/thank-you.html"
status = 200
# Build scripts and source files live in the repo but shouldn't be served
[[redirects]]
from = "/tools/*"
to = "/404.html"
status = 404
force = true
[[redirects]]
from = "/_book_src/*"
to = "/404.html"
status = 404
force = true
[[redirects]]
from = "/_kit_src/*"
to = "/404.html"
status = 404
force = true
