name: Drum news
on:
  schedule:
    - cron: "17 */4 * * *"
  workflow_dispatch:
  push:
    paths:
      - tools/fetch_news.py
      - tools/fetch_videos.py
      - .github/workflows/drum-news.yml
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tools/fetch_news.py
      - run: python tools/fetch_videos.py
        continue-on-error: true
      - name: Commit if changed
        run: |
          git config user.name "drum-news-bot"
          git config user.email "drum-news-bot@users.noreply.github.com"
          git add assets/news.json assets/videos.json 2>/dev/null || git add assets/news.json
          git diff --cached --quiet || (git commit -m "Update drum industry news" && git pull --rebase && git push)
