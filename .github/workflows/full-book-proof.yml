name: Build the full book edition
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/full-book-proof.yml'
      - 'the-names-he-carried/book-edition/**'
      - 'the-names-he-carried/book.json'
      - 'the-names-he-carried/img/**'
      - 'the-names-he-carried/sir-nathaniel/index.html'
      - 'the-names-he-carried/cold-case-file/items.json'
      - 'the-names-he-carried/cold-case-file/register.json'

permissions:
  contents: write

concurrency:
  group: full-book-edition
  cancel-in-progress: false

jobs:
  edition:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install typesetting tools
        run: |
          python -m pip install 'reportlab>=4.2,<5' 'lxml>=5,<7' 'pillow>=10,<13' 'pymupdf>=1.24,<2'
          if ! test -e /usr/share/fonts/truetype/liberation/LiberationSerif-Regular.ttf && ! test -e /usr/share/fonts/truetype/liberation2/LiberationSerif-Regular.ttf; then
            sudo apt-get update -qq
            sudo apt-get install -y fonts-liberation
          fi
      - name: Typeset and verify the complete book
        working-directory: the-names-he-carried/book-edition
        run: |
          python build.py "$RUNNER_TEMP/The-Names-He-Carried-Full-Book-Proof.pdf"
          python verify.py "$RUNNER_TEMP/The-Names-He-Carried-Full-Book-Proof.pdf"
      - name: Publish the verified PDF
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          file="$RUNNER_TEMP/The-Names-He-Carried-Full-Book-Proof.pdf"
          if gh release view full-book-proof >/dev/null 2>&1; then
            gh release upload full-book-proof "$file" --clobber
          else
            gh release create full-book-proof "$file" --target "$GITHUB_SHA" --prerelease --latest=false --title 'The Names He Carried — Full Book Proof' --notes 'The complete illustrated reading proof, rebuilt from the family manuscript and the published research apparatus.'
          fi
